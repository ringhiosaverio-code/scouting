<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VolleyScout Pro</title>
  <meta name="description" content="Scouting video per la pallavolo: clic guidato o codici DataVolley, export DVW, report e video analisi. Funziona offline nel browser.">
  <meta name="theme-color" content="#0f1720">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="26" height="26"> <span>VolleyScout <b>Pro</b></span></div>
    <nav class="tabs" role="tablist" aria-label="Sezioni"></nav>
    <div class="match-info">
      <div id="match-title" class="match-title"></div>
      <div id="match-sub" class="muted small"></div>
    </div>
    <div class="top-actions">
      <span id="video-reopen"></span>
      <button id="issues-badge" class="badge" hidden title="Problemi nei dati"></button>
      <span id="save-state" class="muted small"></span>
      <button class="btn small" id="btn-undo" title="Annulla (Ctrl+Z)">↶</button>
      <button class="btn small" id="btn-redo" title="Ripeti (Ctrl+Y)">↷</button>
      <button class="btn small" id="btn-new">Nuova</button>
      <button class="btn small" id="btn-demo" title="Partita con squadre dimostrative">Demo</button>
      <button class="btn small" id="btn-open">Apri</button>
      <button class="btn small" id="btn-save" title="Salva file progetto (.vsj)">Salva</button>
      <button class="btn small primary" id="btn-dvw" title="Esporta in formato DataVolley">DVW</button>
      <button class="btn small" id="btn-csv" title="Esporta tutti i tocchi in CSV (Excel)">CSV</button>
    </div>
  </header>
  <main>
    <section id="tab-setup" role="tabpanel"></section>
    <section id="tab-scout" role="tabpanel"></section>
    <section id="tab-report" role="tabpanel"></section>
    <section id="tab-playlist" role="tabpanel"></section>
    <section id="tab-settings" role="tabpanel"></section>
  </main>
  <noscript>Serve JavaScript per usare VolleyScout Pro.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
